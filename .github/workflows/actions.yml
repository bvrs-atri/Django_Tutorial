name: CI

on:
  push:
    branches:
      - vbadam_Django_Tutorial_Venkata
  pull_request:
    branches:
      - feature_Django

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mysite tests
        run: pwd

      - name: Run polls tests
        run: pwd
